[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-wiki"
version = "0.1.0"
description = "Local wiki with sources and a headless OpenCode runner"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wiki = "wiki_tools.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["wiki_tools*"]
